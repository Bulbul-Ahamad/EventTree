# 04_TRD §8 rule 13: Dependabot enabled. Weekly, grouped so it stays quiet. Updates still go through CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The stack is locked at major.minor (04_TRD §2): no automatic major bumps (Next, TypeScript, ...).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
